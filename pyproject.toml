[project]
name = "ai-web-research"
version = "0.1.0"
description = "Omphalos / AUSI Runtime: an AI-native search-method runtime with replaceable providers, policy-aware execution, evidence, gaps, and search receipts"
requires-python = ">=3.11"
dependencies = [
    "crawl4ai>=0.6",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "google-genai>=1.0",
    "mcp>=1.0",
]
vertex = [
    "google-genai>=1.0",
]
mcp = [
    "mcp>=1.0",
]

[project.scripts]
crawler = "crawler.cli:main"
crawler-mcp = "crawler.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crawler", "src/ai_web_research"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
